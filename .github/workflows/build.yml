name: Deploy to GitHub Pages

on:
  push:
    branches:
      - lean4  # 如果你的工作分支不是 lean4，请修改成你的分支名，比如 main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Cache Pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install bibtool
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install bibtool -y

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Build the website
        run: NODOWNLOAD=1 python make_site.py

      # 添加调试步骤，检查构建输出
      - name: Check build output
        run: |
          echo "Build directory contents:"
          ls -la ./build/
          echo "Checking for symlinks and hardlinks:"
          find ./build -type l -o -type f -links +1 | head -20 || true
          echo "Build directory size:"
          du -sh ./build/

      # 清理可能的符号链接和设置正确权限
      - name: Clean build artifacts
        run: |
          # 移除任何符号链接
          find ./build -type l -delete || true
          # 确保所有文件都有正确的权限
          find ./build -type f -exec chmod 644 {} \;
          find ./build -type d -exec chmod 755 {} \;

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4