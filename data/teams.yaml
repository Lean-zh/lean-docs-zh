- name: Admin team
  short_description: 管理团队负责监督 Lean 社区组织的活动，特别是 mathlib 项目。其职责是确保 mathlib 项目持续反映 Lean/mathlib 社区的普遍观点和利益。
  description: |
    管理团队负责监督 Lean 社区组织的活动，特别是 mathlib 项目。其职责是确保 mathlib 项目持续反映 Lean/mathlib 社区的普遍观点和利益。

    管理团队是其他团队之间协调的中心枢纽。它负责程序性职责：当需要做出决策时，流程应该如何？特别地，它负责寻找在无法达成共识时解决冲突的程序。管理团队也是整个社区的首要联络点。

    所有团队的成员每年通过选举选出管理团队，选举由现任管理团队组织，采用给予所有成员同等权重投票的系统。管理团队成员可以连任。
