- name: Maintainer team
  short_description: mathlib 维护者有权批准对 mathlib 的更改和增补。该团队负责 mathlib 的全局设计，旨在维护库的一致性并保持其各部分良好集成。
  description: |
    mathlib 库正处于活跃开发中，任何时候都有数百个提议的更改和增补在讨论中，每周都有数十个被批准。这些提议以 [mathlib Github 代码库上的“拉取请求 (pull requests)”](https://github.com/leanprover-community/mathlib4/pulls) 的形式组织。mathlib 维护者是拥有最终批准拉取请求权力的人。他们必须确保 mathlib 具有内聚的设计和高质量的实现。

    Mathlib 维护者通常在数学或计算机科学的某个领域拥有研究水平的知识。社区成员经现任维护者邀请成为维护者，任何人都可以通过向现任维护者发送消息来提名社区成员。维护者的任期为可续任的两年，除非维护者变得不活跃或希望卸任，否则任期将被续展。
