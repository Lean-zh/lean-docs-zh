- name: Mathlib reviewers
  short_description: "mathlib 审查团队协助 mathlib 维护者进行对 mathlib 的 PR 的日常审查。该团队由经验丰富的社区成员组成，他们在贡献和审查中表现出高质量。"
  description: "mathlib 审查团队协助 mathlib 维护者进行对 mathlib 的 PR 的日常审查。该团队由经验丰富的社区成员组成，他们在贡献和审查中表现出高质量。在 PR 的审查过程中，他们会留下评论和反馈。一旦他们认为 PR 已准备好合并，他们就会将 PR 放入队列中，等待 mathlib 维护者的最终审查和合并指令。"
