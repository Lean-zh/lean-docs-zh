- name: 组合结构
  instructor: Assaf Kfoury
  institution: 波士顿大学 (Boston University)
  material: https://hrmacbeth.github.io/math2001/
  tags: ['计算机科学', '入门']
  year: 2025
  lean_version: 4
  summary: >
    本课程将于 2025 年春季学期首次授课。它将涵盖标准离散数学课程在本科入门级别（美国的大一和大二）的主题。
    （因此，课程名称有些名不副实，这是为了避免波士顿大学的一些地盘问题。）
    参考教材是 Heather Macbeth 的《证明的机制》(The Mechanics of Proof)。
    大多数注册学生主修计算机科学，其余少数主修数学或计算机工程。
    该课程旨在教授数学证明的严谨性以及数学科学中常见的各种证明方法。
    学生每周被布置作业，他们必须用以下两种方式之一或两种方式都解决：
    (a) 使用 Lean 4 和 (b) 用手写的“纸笔”风格。
    Lean 4 也将作为一种函数式编程语言使用，特别是在涉及实现标准算法及其在有限图上的一些变体的家庭作业中。
