- name: Lean 4 中的函数式编程与定理证明
  instructor: Leni Aniva, Abdalrhman Mohamed
  institution: 斯坦福大学 (Stanford University)
  website: https://web.stanford.edu/class/cs99/
  tags: ['英语', '计算机科学', '数学', '函数式编程', '定理证明', '元编程']
  year: 2025
  lean_version: 4
  summary: >
    本课程系统地介绍了 Lean 4，首先是作为一门函数式编程语言，然后是一个定理证明器。我们解释了
    Lean 的类型论 (type theoretic) 基础，并展示了定理证明和
    策略 (tactic) 的例子。课程的最后一部分涵盖了 Lean 的编译器和
    元编程 (metaprogramming) 系统。本课程面向数学家和
    计算机科学家。涵盖的内容包括：类型多态、
    Monads、CIC、子类型化、策略、逻辑、集合、可计算性、终止性、
    元编程、宏、繁饰 (Elaboration)、类型合一 (Type Unification) 以及其他证明助手的相关工作。
- name: 密码学导论
  instructor: Matthew Robert Ballard
  institution: 南卡罗来纳大学 (University of South Carolina)
  website: https://587.f24.matthewrobertballard.com
  tags: ['计算机科学', '数学', '密码学']
  year: 2024
  lean_version: 4
  summary: >
    自人类通信出现以来，人们就希望能够私密地交流。
    而其他人则希望窃听那些表面上私密的通信。在我们现代社会，
    大部分互动都在线上进行，这为安全带来了特殊需求，也成为了一个有吸引力的
    目标。

    在本课程中，我们涵盖了密码学的基础知识，从古代使用的密码
    到现代的加密和签名协议。我们专注于密码学和密码分析的
    数学基础。

    我们采用 Lean 作为课程的实现语言，并对形式化验证有一个初步的
    了解。
