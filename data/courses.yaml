- name: 证明与程序
  instructor: Siddhartha Gadgil
  institution: 印度科学研究所，班加罗尔 (Indian Institute of Science, Bangalore)
  website: http://math.iisc.ac.in/~gadgil/proofs-and-programs-2023/
  repo: https://github.com/siddhartha-gadgil/proofs-and-programs-2023
  material: http://math.iisc.ac.in/~gadgil/proofs-and-programs-2023/doc/PnP2023.html
  summary: >
    这是一个关于在 Lean 中证明、编程和证明程序的入门课程，也包括 Lean 的依赖类型论 (Dependent Type Theory) 基础。
    评估主要基于项目，也包括实验。
  experiences: >
    我的计划是现场编码，然后整理、添加文档并用 DocGen4 生成笔记。
    这种方式在一个月内效果很好，有很多问题，我也相应地调整了解释。
    一旦项目开始，讲座与评估的脱节导致出勤率急剧下降。
    我进行了课程修正，将讲座变成了项目演示/帮助/现场编码。
    水平高的学生解释他们做了什么，水平稍低的学生则解释他们做了什么、
    卡在哪里、需要什么等等，我（和他们的同学）帮助他们解决问题。
    这种方式效果很好。下次我教这门课时，我会更早、更有计划地过渡到这种模式。
  year: 2023
  tags: ['证明入门', '计算机科学']
  lean_version: 4
