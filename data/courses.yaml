- name: Lean 学习小组 2023
  instructor: Patrick Kinnear
  institution: 格拉斯哥-麦克斯韦学院 (Glasgow-Maxwell School)
  website: https://www.maths.ed.ac.uk/~pkinnear/leancourse/
  summary: >
    一个为期 1 学期的课程，面向爱丁堡大学、赫瑞瓦特大学和格拉斯哥大学的代数及相关专业研究生。
    旨在让学生像数学家和未来的形式化者一样学习 Lean，在 tactic mode 下建立熟练度。
    课程的第一部分，我们使用教程项目学习了 Lean 中一阶逻辑的基础知识，
    然后讨论了一些类型和类型类的基础知识，以便讨论代数的形式化。还使用了 lftcm2020 的练习题和 MiL。
    最后以一个黑客松结束，进行了一些小组项目。
  experiences: >
    我们早期尽量避免过多地涉及类型论 (type theory)，以便让大家能快速自信地与 Lean 互动。
    回想起来，更深入地讲解这部分内容会更好（尽管是在课程后期，在建立与 Lean 互动的信心之后），
    以帮助处理在形式化一个有趣的数学问题时不可避免地出现的各种问题。
    此外，我们最初的目标是让课程的成果是为 mathlib 贡献的小组项目，
    但现在认为，将目标重新定义为以一种对学习者有用的格式形式化新事物
    （例如，作为工作表/教科书的互动部分）在教学上是更好的目标
    （并且即使这不是明确的目标，也可能在此过程中为 mathlib 做出贡献）。
