- name: 数学形式化入门
  instructor: Vasily Ilin
  institution: 华盛顿大学 (University of Washington)
  year: 2024
  lean_version: 4
  summary: 面向本科生和早期研究生的项目制课程。课程的重点纯粹在于使用 Lean 陈述和证明数学命题的实践方面。预期的成果不是对 Lean 工作原理的深刻理解，而是具备分解问题、调试、在 Zulip 上高效求助等实践技能。学生们前 3 周在 MiL 中做练习，后 7 周做一个项目。
