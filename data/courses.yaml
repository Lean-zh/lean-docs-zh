- name: 数学形式化验证入门
  instructor: Philip Matchett Wood
  institution: 哈佛大学 (Harvard University)
  lean_version: 3
  tags: ['数学']
  summary: >
    本课程面向至少修过 2 门基于证明的数学课程的本科生。我们学习了当时最新版本的
    《Mathematics in Lean》一书，作者是 Jeremy Avigad 和 Patrick
    Massot。该课程很大程度上模仿了 Jeremy Avigad
    于 2022 年在卡内基梅隆大学教授的一门课程。学生每周完成作业，实现或补充一些小型示例结果的
