# 该文件中的条目应包含以下字段：
#
# `name`: 课程标题
# `instructor`: 授课教师姓名
# `institution`: 授课机构名称
# `year`: 课程最近的授课年份
# `lean_version`: 3 或 4，课程最近一次迭代使用的 Lean 版本
# `summary`: 课程内容和活动的描述
# `tags`: 标签列表（见下文）
# `website` (可选): 课程主页
# `material` (可选): 教科书、课程笔记等链接
# `repo` (可选): 课程项目仓库链接，例如在 GitHub 上
# `experiences` (可选): 关于课程进展、可改进之处等的反思
# `language` (可选): 如果教学语言不是英语，请指明是何种语言
#
# 请使用网站上显示的标签。特别是，每个条目都应有一个通用主题（`mathematics`、`logic`、`computer science`）。
#
# 此列表无序。可在任意位置添加新条目。
