super:
  description: |
    一个用 Lean 编写的小型叠加证明器 (superposition prover) 的第一版。
    该代码库引入了一个策略 `super`，它试图解决一阶逻辑 (first order logic) 问题，并可能接受一个额外的假设列表。

    此版本与 Lean 的社区版本不兼容。
  organization: 'leanprover'
  maintainers:
    - gebner

super2:
  description: |
    一个用 Lean 编写的小型叠加证明器 (superposition prover) 的第二版。
    该代码库引入了一个策略 `super`，它试图解决一阶逻辑 (first order logic) 问题，并可能接受一个额外的假设列表。
  organization: 'gebner'
  maintainers:
    - gebner

mathematica:
  description: |
    将 Lean 与计算机代数系统 (computer algebra system) Mathematica 连接起来。
    该项目提供了两个系统之间的双向翻译。
    在 Lean 内部，你可以执行 Mathematica 命令（可能包含翻译后的 Lean 表达式）并处理结果。
    在 Mathematica 中，你可以访问 Lean 环境。

    从 Lean 调用 Mathematica 的示例可以在 [robertylewis/mathematica_examples](https://github.com/robertylewis/mathematica_examples) 找到，
    反向调用的示例可以在 [minchaowu/mm-lean](https://github.com/minchaowu/mm-lean) 找到。
    这些代码库未被列入贡献列表，因为它们依赖于专有软件 Mathematica。
    另请参阅我们的[项目网页](http://robertylewis.com/leanmm/index.html)，其中有关于该项目的论文链接。
  organization: 'robertylewis'
  maintainers:
    - robertylewis
    - minchaowu
  report-build-failures: false

topos:
  description: |
    该代码库包含了对拓扑斯理论 (Topos Theory) 中结果的形式化验证，内容来源于《Sheaves in Geometry and Logic》和《Sketches of an Elephant》。它目前包含一系列关于格罗滕迪克拓扑斯 (Grothendieck topoi) 和初等拓扑斯 (elementary toposes) 的构造和定理。
  organization: 'b-mehta'
  maintainers:
    - b-mehta
  report-build-failures: false

lean-perfectoid-spaces:
  description: |
    完备胚空间 (Perfectoid spaces) 是 Peter Scholze 在 2012 年引入的算术几何中的复杂对象。
    我们在拓扑学、代数和几何学中形式化了足够多的定义和定理，以便在 Lean 中定义完备胚空间。
    另请参阅我们的[项目网页](https://leanprover-community.github.io/lean-perfectoid-spaces/)和[论文](https://arxiv.org/abs/1910.12320)。
  organization: 'leanprover-community'
  maintainers:
    - kbuzzard
    - jcommelin
    - PatrickMassot
  report-build-failures: false

sudoku:
  description: |
    这是一个用 Lean 编写的数独实现。当你在 VS Code 中打开一个关卡时，
    目标视图中会显示一个数独棋盘。你可以通过添加假设将数字（以及候选数）
    填入棋盘，但你必须证明所填数字的逻辑是基于棋盘上已有数字的！
    有一些策略可以帮助你完成此任务，你还可以证明定理来建立你自己的
    数独理论库。
  organization: 'TwoFx'
  maintainers:
    - TwoFx
  report-build-failures: false

lftcm2020:
  description: |
    该代码库包含了为 2020 年 7 月举办的研讨会 [Lean for the Curious Mathematician](https://leanprover-community.github.io/lftcm2020/) 
    开发的关于 Lean 和 mathlib 的教程。
    教程内容从数字、逻辑和集合的入门课程，到范畴论和流形的高级课程。
    除了本代码库中的材料，我们还建议观看研讨会教程和讲座的[视频](https://www.youtube.com/playlist?list=PLlF-CfQhukNlxexiNJErGJd2dte_J1t1N)。
  organization: 'leanprover-community'
  maintainers:
    - jcommelin
    - PatrickMassot
  report-build-failures: false

rubiks-cube-group:
  description: |
    该项目将魔方群 (Rubik's cube group) 形式化为角块朝向、角块排列、棱块朝向和棱块排列的乘积。

    可解子群 (solvable subgroup) 被定义为所有角块和棱块朝向之和为 0 且排列符号相同的状态集合。

    该项目包含一个可视化小部件，可以将群中的元素显示为实体魔方的状态。
  organization: 'kendfrey'
  maintainers:
    - kendfrey
  report-build-failures: false

lean-liquid:
  description: |
    液态张量实验 (Liquid Tensor Experiment) 是 Peter Scholze 提出的一项挑战，
    旨在形式化部分凝聚数学 (condensed mathematics)，其最终目标是液态模 (liquid modules) 的主定理。
  organization: 'leanprover-community'
  maintainers:
    - jcommelin
  report-build-failures: false

lean-gptf:
  description: |
    为 Lean GPT-f 提供了一个交互式前端。Lean GPT-f 是一个神经定理证明器，
    它依赖于一个大型 Transformer 语言模型来建议策略。
    它能够证明一个保留测试集中近 50% 的剩余定理。
    请参阅 Jason Rute's 在 [Lean Together 2021 上的演讲](https://www.youtube.com/watch?v=eSXiClL4COw)。
  organization: 'jesse-michael-han'
  maintainers:
    - jesse-michael-han
    - jasonrute
    - tonywu95
    - edayers
    - spolu
  report-build-failures: false

lean-ga:
  description: |
    对[几何代数 (Geometric Algebra)](https://en.wikipedia.org/wiki/Geometric_algebra) 部分内容的形式化，
    也是 `clifford_algebra` 库大部分内容毕业进入 mathlib 的源头。
  organization: 'pygae'
  maintainers:
    - eric-wieser
    - utensil
  report-build-failures: false

lean-social-choice:
  description: |
    社会选择理论 (Social Choice Theory) 是一个处于哲学、政治学和
    福利经济学交叉领域的理论框架。它研究将个人偏好
    聚合成集体社会福利函数的方法。

    这是一个用 Lean 形式化的、来自社会选择理论的著名证明库。
  organization: 'asouther4'
  maintainers:
    - asouther4
    - benjamindavidson
  report-build-failures: false

flt-regular:
  description: |
    该项目的目标是形式化库默 (Kummer) 对正则素数 (regular prime) 指数下的费马大定理的证明。
    这是 19 世纪代数数论中的一个里程碑式结果，在当时证明了许多新情况下的定理，
    但与怀尔斯-泰勒 (Wiles-Taylor) 给出的完整定理的最终证明有很大不同。
    除了形式化库默证明的一个版本，该项目还希望为 mathlib 增添更多关于代数数论及相关
    主题的材料。
  organization: 'leanprover-community'
  maintainers:
    - alexjbest
    - riccardobrasca
    - ericrbg
    - CBirkbeck
  report-build-failures: false

unit-fractions:
  description: |
    该项目在 Lean 中形式化了预印本[关于单位分数的密度猜想 (On a density conjecture about unit fractions)](https://arxiv.org/abs/2112.03726) 的主要结果。
    其中一个结果表明，任何自然数的稠密子集都包含不同的自然数，其倒数之和为 1。
  organization: 'b-mehta'
  maintainers:
    - b-mehta
    - TFBloom
  report-build-failures: false

lean-acl-pairs:
  description: |
    该项目包含了所谓的 `acl`-对 (`acl`-pairs) 与赋值环 (valuation rings) 之间关系的形式化。
    如果 `K` 和 `F` 是两个域，一对（群）态射 `f g : Kˣ → F` 被称为一个 `acl`-对，条件是只要 `K` 中 `u + v = 1`，就有 `f u * g v = f v * g u`。
    关于此类对的主要结果表明，它们基本上总是源于赋值理论，至少当 `F` 是一个素域（例如 `ℚ` 或 `zmod p`，其中 `p` 是素数）时是如此。
    本代码库中形式化的证明基于 Bogomolov-Tschinkel、Efrat、Koenigsmann 和作者的思想。
    该代码库还形式化了一些由 Arason-Elman-Jacob 提出的关于刚性元素 (rigid elements) 和赋值的成果。
  organization: 'adamtopaz'
  maintainers:
    - adamtopaz
  report-build-failures: false

con-nf:
  description: |
    对奎因 (Quine) 的新基础公理系统 (New Foundations axiom system) 相容性的形式化，遵循 [Randall Holmes 的证明](https://randall-holmes.github.io/Nfproof/untangled.pdf)。这可以说是集合论中悬而未决时间最长的公开问题。
  organization: 'leanprover-community'
  maintainers:
    - YaelDillies
    - zeramorphic
  report-build-failures: false

sphere-eversion:
  description: |
    在这个项目中，我们在 Lean 中形式化了球面外翻 (sphere eversions) 存在性的证明。更精确地说，我们的目标是为开放且丰富的 (open and ample) 一阶微分关系形式化完整的 h-原则 (h-principle)，并由此推导出球面外翻的存在性作为推论。
  organization: 'leanprover-community'
  maintainers:
    - PatrickMassot
    - fpvandoorn
    - ocfnash
  report-build-failures: false

flypitch:
  description: |
    Flypitch 项目给出了连续统假设 (continuum hypothesis) 独立于 ZFC 的形式化证明。
    连续统假设断言，在最小的无限基数和连续统的基数之间不存在其他基数。
    该项目还开发了一个关于一阶逻辑、集合论和力迫法 (forcing) 的库。
  organization: 'flypitch'
  maintainers:
    - jesse-michael-han
    - fpvandoorn
  report-build-failures: false
  
grammars:
  description: |
    该项目的目标是形式化乔姆斯基谱系 (Chomsky hierarchy)。
    到目前为止，主要焦点是证明通用（0 型）文法的闭包性质 (closure properties)。
    我们也有一些关于上下文无关（2 型）文法的结果。
  organization: 'madvorak'
  maintainers:
    - madvorak
  report-build-failures: true

lean-matrix-cookbook:
  description: |
    该项目旨在将 [The Matrix Cookbook](https://www.math.uwaterloo.ca/~hwolkowi/matrixcookbook.pdf) 中的引理作为证明在 Lean 定理证明器中提供。
    理想情况下，本代码库中的每个证明都应引用 Mathlib 中的一个引理；这可以作为 Mathlib 中标准矩阵结果的索引（和进度报告）。
  organization: 'eric-wieser'
  maintainers:
    - eric-wieser
  report-build-failures: false